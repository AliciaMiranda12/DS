<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página Inicial</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="pagina.html">API do Pokémon</a>
    </div>
  </nav>

  <!-- Conteúdo principal -->
  <div class="container mt-5">
    <h1 class="text-center mb-4">Batalha Pokémon</h1>

    <div class="row g-4">
      <!-- Pokémon 1 -->
      <div class="col-md-6">
        <div class="card p-4 shadow-sm">
          <h5 class="card-title">Pokémon 1</h5>
          <input type="text" id="pkm_name" class="form-control mb-2" placeholder="Insira o nome do Pokémon">
          <button onclick="buscarPokemon()" class="btn btn-primary w-100">Buscar</button>
          <div id="resultado" class="mt-3">...</div>
          <label for="hp1" class="form-label mt-2">HP</label>
          <progress id="hp1" value="0" max="100" class="w-100"></progress>
        </div>
      </div>

      <!-- Pokémon 2 -->
      <div class="col-md-6">
        <div class="card p-4 shadow-sm">
          <h5 class="card-title">Pokémon 2</h5>
          <input type="text" id="pkm_name2" class="form-control mb-2" placeholder="Insira o nome do Pokémon">
          <button onclick="buscarPokemon2()" class="btn btn-primary w-100">Buscar</button>
          <div id="resultado2" class="mt-3">...</div>
          <label for="hp2" class="form-label mt-2">HP</label>
          <progress id="hp2" value="0" max="100" class="w-100"></progress>
        </div>
      </div>
    </div>

    <!-- Batalha -->
    <div class="mt-5 text-center">
      <h2>Log de Batalha</h2>
      <button onclick="batalhar()" class="btn btn-danger btn-lg mt-3">Iniciar Batalha</button>
      <div id="resultadoBatalha" class="mt-4">...</div>
      <div id="resultadoLog" class="mt-2">...</div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="Pokemon.js"></script>
  <script src="batalha.js"></script>
</body>
</html>

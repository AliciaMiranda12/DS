<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Treinadores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="pagina.html">API do Pokémon</a>
    </div>
  </nav>
 <div class="container mt-5">
  <h1 class="text-center mb-4">Cadastro de Treinadores Pokémon</h1>

  <form id="formTreinador" class="row g-3">
    <div class="col-md-6">
      <label for="nome" class="form-label">Nome</label>
      <input type="text" id="nome" class="form-control" required>
    </div>

    <div class="col-md-3">
      <label for="idade" class="form-label">Idade</label>
      <input type="number" id="idade" class="form-control" required>
    </div>

    <div class="col-md-3">
      <label for="cidade" class="form-label">Cidade</label>
      <input type="text" id="cidade" class="form-control" required>
    </div>

    <div class="col-12">
      <label for="pokemons" class="form-label">Pokémons</label>
      <input type="text" id="pokemons" class="form-control">
    </div>

    <div class="col-12 text-center">
      <button type="submit" class="btn btn-primary mt-3">Cadastrar Treinador</button>
    </div>
  </form>

  <hr class="my-5">

  <h2 class="text-center">Treinadores Cadastrados</h2>
  <ul id="listaTreinadores" class="list-group mt-3"></ul>
</div>


  <script src="Treinador.js"></script>
  <script src="main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
